# Plantilla. No acredita nada hasta que se instale en un repositorio remoto
# y se vean sus resultados. El CI completo (tipos, estilo, pruebas, pgTAP,
# escáneres) se monta en la fase 1.
#
# Acciones fijadas por SHA completo de commit con la versión en comentario (T-124, D-036, 21/11/2026);
# lo comprueba tests/unit/plataforma/acciones-fijadas.test.ts. Dependabot propone las subidas.
# Pendiente: canal de aviso para los fallos del diario sobre main (función 003).

name: Arnés

on:
  pull_request:
  push:
    branches: [main]
  # Diario sobre main (D-030): una vulnerabilidad nueva o una firma revocada aparece sin esperar a un cambio.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  comprobar:
    name: Comprobador documental y de suministro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Comprobar trazabilidad, cabeceras y secretos
        run: node scripts/comprobar-specs.mjs
      - name: Instalar dependencias del bloqueo (sin scripts, explícito y por .npmrc)
        run: npm ci --ignore-scripts
      - name: Auditar vulnerabilidades
        run: npm audit
      - name: Verificar firmas y procedencia del registro
        run: npm audit signatures
      - name: Pruebas de plataforma (Vitest, sin red real ni secretos)
        run: npx vitest run tests/unit/plataforma
